spring.application.name=TSIPPOLibrary
server.port=8080

# JWT (ТЗ 3.5.3: access 30 мин = 1800000 мс, refresh 30 дней = 2592000000 мс)
# Оставляем значения из ТЗ для совместимости, но по умолчанию ставим как в ТЗ
jwt-secret=fdLwz0v0J3UQDrb+DJl2+618BLj24xPq+ZZkU95uUsQ=
jwt-expiration=1800000
jwt-refresh-expiration=2592000000

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:library}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.jpa.hibernate.ddl-auto=update
# Логируем SQL для отладки (можно отключить в проде)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis кэш (ТЗ 3.1.6, 3.3.4) — если недоступен, приложение работает через БД (CacheErrorHandler)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000
spring.cache.type=redis

# Плановая очистка кэша — каждый день в 00:00 (ТЗ 3.1.6)
library.cache.evict-cron=0 0 0 * * *

# Владелец (ТЗ 3.1.5) — создаётся при первом запуске
library.owner.username=${LIBRARY_OWNER_USERNAME:owner}
library.owner.email=${LIBRARY_OWNER_EMAIL:owner@library.local}
library.owner.password=${LIBRARY_OWNER_PASSWORD:owner123}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Логи
logging.level.ru.khalov.tsippolibrary=INFO
logging.level.org.springframework.security=DEBUG

springdoc.swagger-ui.persist-authorization=true
