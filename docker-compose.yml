services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: library
    ports:
      - "5433:5432"
  # ТЗ 3.1.6, 3.3.4, 3.6.2: Redis для кэша каталога книг
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"